<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Premio</title>
  <style>
    body {
      background: linear-gradient(135deg, gold, orange);
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 100px;
    }
    .card {
      background: white;
      padding: 40px;
      margin: auto;
      width: 80%;
      max-width: 400px;
      border-radius: 15px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }
    h1 {
      color: green;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🎉 ¡FELICIDADES wladimir medina! 🎉</h1>
    <p>Has sido seleccionado para recibir:</p>
    <h2 id="premio"></h2>
    <p style="font-size:12px;color:gray;">(Esto es solo una broma y en realidad te hackeamos)</p>
  </div>

  <script>
    const premios = [
      "Un millón de dólares 💰 (imaginarios)",
      "Un viaje a dubai con slomith 🤗",
      "un paseo con luna 🍕",
      "100 lukas en efectivo 😆",
      "una casa frente al mar por solo una luka👍",
      "un dia entero con luisito comunica 😎"
    ];

    const aleatorio = Math.floor(Math.random() * premios.length);
    document.getElementById("premio").innerText = premios[aleatorio];
  </script>

  <audio id="sonido" autoplay>
  <source src="victory.mp3" type="audio/mpeg">
</audio>

</body>
</html>

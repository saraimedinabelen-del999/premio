<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Premio sorpresa 🎁</title>
</head>
<body style="text-align:center; margin-top:50px; font-family:Arial;">

  <h1>🎉 ¡FELICIDADES Wladimir Medina! 🎉</h1>
  <p>Haz clic para descubrir tu premio</p>

  <button onclick="reproducir()" style="padding:15px;font-size:18px;cursor:pointer;">
    🎁 Ver premio
  </button>

  <h2 id="premio"></h2>

  <script>
    const premios = [
      "Un millón de lukas 💰 (imaginarias)",
      "un paseo con la luna🤗",
      "un viaje a dubai con la Schlomith🍕",
      "una casa frente al mar por 1 luka 😆",
      "cocacola gratis de por vida 👍",
      "vivir 1 año con luisito comunica 😎"
    ];

    function reproducir() {
      const aleatorio = Math.floor(Math.random() * premios.length);
      document.getElementById("premio").innerText = premios[aleatorio];

      const audio = new Audio("success-fanfare-trumpets-6185.mp3");
      audio.play();
    }
  </script>

</body>
</html>
